<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuvix Tricorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="w-[380px] bg-background text-foreground antialiased">
  <!-- Header -->
  <div class="border-b bg-card px-3 py-2 flex items-center justify-between">
    <h1 class="text-sm font-semibold leading-none">Tuvix Tricorder</h1>
    <button
      id="settingsBtn"
      aria-label="Open settings"
      class="inline-flex h-6 w-6 items-center justify-center rounded hover:bg-accent transition-colors"
      title="Settings"
    >
      <svg class="h-3.5 w-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
  </div>

  <!-- Content -->
  <div class="p-3 space-y-2">
    <!-- Status -->
    <div class="flex items-center gap-2 text-xs text-muted-foreground" role="status" aria-live="polite" aria-atomic="true">
      <div id="statusIcon" class="h-2 w-2 rounded-full transition-all duration-300 ease-in-out" aria-hidden="true"></div>
      <span id="statusText">Ready to scan</span>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2">
      <button
        id="discoverBtn"
        aria-describedby="statusText"
        class="inline-flex h-8 flex-1 items-center justify-center rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50"
      >
        Discover Feeds
      </button>
      <button
        id="refreshBtn"
        aria-label="Refresh feed discovery from source"
        class="hidden inline-flex h-8 w-8 items-center justify-center rounded-md bg-secondary text-secondary-foreground shadow-sm transition-colors hover:bg-secondary/80 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
        title="Refresh from source"
      >
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>

    <!-- Feeds List -->
    <div id="feedsList" role="region" aria-label="Discovered feeds" class="space-y-1.5 max-h-[320px] overflow-y-auto"></div>

    <!-- Error Alert -->
    <div id="error" role="alert" aria-live="assertive" class="hidden rounded-md border border-destructive/50 bg-destructive/10 p-2 text-xs text-destructive"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
